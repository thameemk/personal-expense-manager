repos:
  - repo: local
    hooks:
      - id: backend-ruff
        name: backend ruff check
        entry: uv run --directory backend ruff check .
        language: system
        pass_filenames: false

      - id: backend-format
        name: backend ruff format check
        entry: uv run --directory backend ruff format --check .
        language: system
        pass_filenames: false

#      - id: backend-tests
#        name: backend pytest
#        entry: uv run --directory backend pytest
#        language: system
#        pass_filenames: false

      - id: web-lint
        name: web eslint
        entry: pnpm --dir web lint
        language: system
        pass_filenames: false

      - id: web-build
        name: web build
        entry: pnpm --dir web build
        language: system
        pass_filenames: false
